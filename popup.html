<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korochin PageShot</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header><span class="mark" aria-hidden="true">▣</span><div><h1>PageShot</h1><p>Webページを、そのままPNGに。</p></div></header>
  <main>
    <h2>表示中の領域</h2>
    <div class="actions">
      <button class="capture" data-mode="viewport" data-destination="download"><span class="label">PNG保存</span><kbd id="capture-viewport-key">…</kbd></button>
      <button class="capture" data-mode="viewport" data-destination="clipboard"><span class="label">コピー</span><kbd id="copy-viewport-key">…</kbd></button>
    </div>
    <h2>ページ全体</h2>
    <div class="actions">
      <button class="capture" data-mode="fullpage" data-destination="download"><span class="label">PNG保存</span><kbd id="capture-fullpage-key">…</kbd></button>
      <button class="capture" data-mode="fullpage" data-destination="clipboard"><span class="label">コピー</span><kbd id="copy-fullpage-key">…</kbd></button>
    </div>
    <p class="destination">PNG保存先：ダウンロード / screenshots</p>
    <p id="status" role="status" aria-live="polite">撮影方法を選んでください。</p>
    <p class="note">全体撮影中はデバッグ接続の通知が表示されます。遅延読み込みの画像は、先にスクロールして読み込んでください。</p>
  </main>
  <footer><button id="shortcuts" class="link">ショートカットを変更</button><span>PNG · 保存 / コピー</span></footer>
</body>
</html>
