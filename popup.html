<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korochin PageShot</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header><span class="mark" aria-hidden="true">▣</span><div><h1>PageShot</h1><p>Webページを、そのままPNGに。</p></div></header>
  <main>
    <button class="capture" data-mode="viewport"><span class="label">表示中の領域<span class="description">今見えているWebページ部分だけ</span></span><kbd id="viewport-key">…</kbd></button>
    <button class="capture" data-mode="fullpage"><span class="label">ページ全体<span class="description">画面外を含めて1枚に保存</span></span><kbd id="fullpage-key">…</kbd></button>
    <p class="destination">保存先：ダウンロード / screenshots</p>
    <p id="status" role="status" aria-live="polite">撮影方法を選んでください。</p>
    <p class="note">全体撮影中はデバッグ接続の通知が表示されます。遅延読み込みの画像は、先にスクロールして読み込んでください。</p>
  </main>
  <footer><button id="shortcuts" class="link">ショートカットを変更</button><span>PNG · ローカル保存</span></footer>
</body>
</html>
